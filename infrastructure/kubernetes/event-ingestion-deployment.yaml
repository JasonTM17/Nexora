# M7-T01 Kubernetes deployment template for Nexora Event Ingestion.
# Apply after: cloud provider decision, NATS clustering, container registry.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexora-event-ingestion
  namespace: {{NAMESPACE}}
  labels:
    app: nexora-event-ingestion
    tier: edge
spec:
  replicas: {{REPLICAS}}
  selector:
    matchLabels:
      app: nexora-event-ingestion
  template:
    metadata:
      labels:
        app: nexora-event-ingestion
        tier: edge
    spec:
      containers:
        - name: ingestion
          image: {{IMAGE}}
          ports:
            - containerPort: 18080
          env:
            - name: NEXORA_EVENT_INGESTION_ADDR
              value: "0.0.0.0:18080"
            - name: NEXORA_EVENT_INGESTION_BODY_LIMIT_BYTES
              value: "65536"
            - name: NEXORA_EVENT_INGESTION_MAX_CONCURRENCY
              value: "128"
            - name: NEXORA_EVENT_INGESTION_RATE_LIMIT_PER_MINUTE
              value: "60"
            - name: NEXORA_EVENT_INGESTION_RATE_LIMIT_KEYS
              value: "10000"
            - name: NEXORA_ADMISSION_URL
              valueFrom:
                configMapKeyRef:
                  name: nexora-config
                  key: admissionUrl
            - name: NEXORA_NATS_URL
              valueFrom:
                configMapKeyRef:
                  name: nexora-config
                  key: natsUrl
            - name: NEXORA_REDIS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: nexora-config
                  key: redisAddr
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 18080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: nexora-event-ingestion
  namespace: {{NAMESPACE}}
spec:
  selector:
    app: nexora-event-ingestion
  ports:
    - port: 80
      targetPort: 18080
  type: ClusterIP
