# M7-T01 Kubernetes deployment template for Nexora Platform API.
# Apply after: cloud provider decision, container registry push, DB migration.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexora-platform-api
  namespace: {{NAMESPACE}}
  labels:
    app: nexora-platform-api
    tier: backend
spec:
  replicas: {{REPLICAS}}
  selector:
    matchLabels:
      app: nexora-platform-api
  template:
    metadata:
      labels:
        app: nexora-platform-api
        tier: backend
    spec:
      containers:
        - name: api
          image: {{IMAGE}}
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "database"
            - name: NEXORA_AUTH_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: nexora-config
                  key: authIssuer
            - name: NEXORA_AUTH_JWKS_URI
              valueFrom:
                configMapKeyRef:
                  name: nexora-config
                  key: jwksUri
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: nexora-db
                  key: url
            - name: NEXORA_REDIS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: nexora-config
                  key: redisAddr
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: nexora-platform-api
  namespace: {{NAMESPACE}}
spec:
  selector:
    app: nexora-platform-api
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
