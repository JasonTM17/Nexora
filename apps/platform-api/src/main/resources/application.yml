spring:
  application:
    name: nexora-platform-api
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  profiles:
    default: local
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  address: ${NEXORA_BIND_ADDRESS:127.0.0.1}
  shutdown: graceful

nexora:
  auth:
    issuer: ${NEXORA_AUTH_ISSUER:http://127.0.0.1:9099/auth/v1}
    audience: ${NEXORA_AUTH_AUDIENCE:authenticated}
    jwk-set-uri: ${NEXORA_AUTH_JWKS_URI:http://127.0.0.1:9099/auth/v1/.well-known/jwks.json}
  platform:
    api-version: v1
    migration-contract:
      baseline-version: V001
      runtime-role: nexora_runtime
      schemas: [nexora, rag, audit]
  realtime:
    descriptor:
      issuer: ${NEXORA_REALTIME_DESCRIPTOR_ISSUER:nexora-platform-realtime}
      jwt-secret: ${NEXORA_REALTIME_JWT_SECRET:local-realtime-descriptor-secret-change-before-hosting}
      ttl-seconds: ${NEXORA_REALTIME_DESCRIPTOR_TTL_SECONDS:120}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
