spring:
  application:
    name: nexora-platform-api
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  profiles:
    default: local
  lifecycle:
    timeout-per-shutdown-phase: 20s

logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO
    com.nexora.platform: DEBUG

server:
  address: ${NEXORA_BIND_ADDRESS:127.0.0.1}
  shutdown: graceful

nexora:
  auth:
    issuer: ${NEXORA_AUTH_ISSUER:http://127.0.0.1:9099/auth/v1}
    audience: ${NEXORA_AUTH_AUDIENCE:authenticated}
    jwk-set-uri: ${NEXORA_AUTH_JWKS_URI:http://127.0.0.1:9099/auth/v1/.well-known/jwks.json}
    legacy-secret: ${NEXORA_AUTH_LEGACY_SECRET:}
    legacy-hs256-fallback: ${NEXORA_LEGACY_HS256_FALLBACK:false}
  platform:
    api-version: v1
    migration-contract:
      baseline-version: V001
      runtime-role: nexora_runtime
      schemas: [nexora, rag, audit]
  realtime:
    descriptor:
      issuer: ${NEXORA_REALTIME_DESCRIPTOR_ISSUER:nexora-platform-realtime}
      jwt-secret: ${NEXORA_REALTIME_JWT_SECRET}
      ttl-seconds: ${NEXORA_REALTIME_DESCRIPTOR_TTL_SECONDS:120}
  security:
    max-failed-logins: ${NEXORA_MAX_FAILED_LOGINS:5}
    lockout-minutes: ${NEXORA_LOCKOUT_MINUTES:15}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
    prometheus:
      enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
      service: platform-api
    distribution:
      percentiles-histogram:
        http.server.requests: true
      sla:
        http.server.requests: 50ms,100ms,200ms,500ms,1s,5s

springdoc:
  api-docs:
    path: /v3/api-docs
