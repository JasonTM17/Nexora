name: Validate repository foundation

on:
  push:
    branches: [main, 'chore/**', 'feature/**', 'fix/**']
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate repository foundation
        shell: pwsh
        run: ./tools/validate-repo.ps1
      - name: Render Compose configuration
        run: docker compose -f compose.yaml config --quiet

  go-ingestion:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/event-ingestion
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache-dependency-path: services/event-ingestion/go.sum
      - name: Vet Go event-ingestion service
        run: go vet ./...
      - name: Test Go event-ingestion service
        run: go test -cover -coverprofile=coverage.out ./...
      - name: Upload Go coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-coverage
          path: services/event-ingestion/coverage.out

  platform-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/platform-api
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven
      - name: Compile and run the full test suite
        run: sh mvnw -q test
      - name: Generate coverage report (JaCoCo)
        run: sh mvnw -q jacoco:report
        continue-on-error: true

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        run: corepack enable && corepack prepare pnpm@11.0.9 --activate
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Run web unit tests
        run: pnpm --filter @nexora/web test
      - name: Run contracts tests
        run: node --test packages/contracts/tests/*.mjs
