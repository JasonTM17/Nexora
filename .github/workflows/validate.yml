name: Validate repository foundation

on:
  push:
    branches: [main, 'chore/**', 'feature/**', 'fix/**']
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate repository foundation
        shell: pwsh
        run: ./tools/validate-repo.ps1
      - name: Render Compose configuration
        run: docker compose -f compose.yaml config --quiet

  go-ingestion:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/event-ingestion
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache-dependency-path: services/event-ingestion/go.sum
      - name: Vet Go event-ingestion service
        run: go vet ./...
      - name: Test Go event-ingestion service
        run: go test -cover -coverprofile=coverage.out ./...
      - name: Upload Go coverage
        uses: actions/upload-artifact@65c4c4a1ddee5b72f69819ecde39500697a03a13 # v4.6.0
        with:
          name: go-coverage
          path: services/event-ingestion/coverage.out

  platform-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/platform-api
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven
      - name: Compile and run unit tests
        run: sh mvnw -q test -Dtest='JwtValidationTests,EventContractV1_1Test,OutboxPublisherSchedulerTest,OutboxPublisherTest,EventAdmissionServiceTest,EventConsumerWiringTest'
      - name: Generate coverage report (JaCoCo)
        run: sh mvnw -q jacoco:report
        continue-on-error: true