# M6-R01 Loki configuration. Receives logs via Promtail or direct push.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9066

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h  # 7 days
  max_query_parallelism: 2

analytics:
  reporting_enabled: false
