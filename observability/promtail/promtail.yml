# M6-R01 Promtail configuration. Ships container/service logs to Loki.
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: nexora-services
    static_configs:
      - targets:
          - localhost
        labels:
          job: nexora-services
          __path__: /var/log/nexora/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            msg: msg
            traceId: traceId
            service: service
      - labels:
          level:
          service:
